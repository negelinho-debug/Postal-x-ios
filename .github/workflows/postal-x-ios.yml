name: Postal X iOS v5 - full APK IL2CPP recovery check

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  recover:
    name: Recover Postal X IL2CPP scripts from FULL APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get the original PostalX_ANDROID.apk from Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output work/apk
          if [ ! -f input/PostalX_ANDROID.apk ]; then
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              gh release download "$tag" \
                --pattern 'PostalX_ANDROID.apk' \
                --dir input --clobber && break || true
            done < <(gh release list --limit 30 --json tagName --jq '.[].tagName')
          fi
          test -s input/PostalX_ANDROID.apk || {
            echo 'ERROR: Add PostalX_ANDROID.apk to a Release of THIS repository.' >&2
            exit 1
          }
          sha256sum input/PostalX_ANDROID.apk | tee output/apk-sha256.txt
          unzip -q input/PostalX_ANDROID.apk -d work/apk

      - name: Verify Unity 6 IL2CPP and extract the ORIGINAL icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          base = Path('work/apk')
          gg = base/'assets/bin/Data/globalgamemanagers'
          meta = base/'assets/bin/Data/Managed/Metadata/global-metadata.dat'
          il2cpp = base/'lib/arm64-v8a/libil2cpp.so'
          icon = base/'res/oj.png' # Verified launcher bitmap from THIS APK
          for p in (gg, meta, il2cpp, icon):
              if not p.is_file():
                  raise SystemExit('Wrong/missing Postal X APK file: '+str(p))
          version = '6000.2.7f2'
          if version.encode() not in gg.read_bytes():
              raise SystemExit('Expected Unity '+version+' in globalgamemanagers')
          Path('output/PostalX-original-icon.png').write_bytes(icon.read_bytes())
          Path('output/unity-version.txt').write_text(version+'\n')
          Path('output/il2cpp-info.txt').write_text(
              'Android IL2CPP confirmed. Android libil2cpp.so is not an iOS binary.\n'
              'Game scripts may not be recoverable from APK metadata.\n'
              'A reconstructed project is NOT equivalent to original Unity source.\n'
          )
          print('Unity version:',version,'icon sha256:',sha256(icon.read_bytes()).hexdigest())
          PY

      - name: Join Android Unity split assets for AssetRipper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path('work/apk/assets/bin/Data')
          groups={}
          for f in d.rglob('*.split*'):
              m=re.fullmatch(r'(.+)\.split(\d+)', f.name)
              if m:
                  groups.setdefault(f.with_name(m.group(1)), {})[int(m.group(2))]=f
          lines=[]
          for target,parts in sorted(groups.items()):
              order=sorted(parts)
              if order != list(range(len(order))):
                  raise SystemExit(f'Nonconsecutive split parts: {target}: {order}')
              if target.exists():
                  raise SystemExit(f'Refusing to overwrite Unity file: {target}')
              with target.open('wb') as out:
                  for i in order:
                      with parts[i].open('rb') as inp:
                          while True:
                              block=inp.read(1024*1024)
                              if not block: break
                              out.write(block)
              lines.append(f'{target.name}: {target.stat().st_size} bytes / {len(order)} parts')
          Path('output/rejoined-split-assets.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Download correct AssetRipper 2.0.0 for Linux x86_64
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tools/assetripper

          echo "Runner CPU: $(uname -m)"
          test "$(uname -m)" = "x86_64" || {
            echo 'This workflow requires the GitHub Ubuntu x86_64 runner.' >&2
            exit 1
          }

          gh api repos/AssetRipper/AssetRipper/releases/tags/2.0.0 \
            --jq '.assets[].name' | tee output/assetripper-assets.txt

          # v2 accidentally matched ARM64 because its regex ended in "64".
          # Pick ONLY the x64 archive, NEVER linux_arm64 or Windows/macOS.
          ASSET="$(grep -Ei '^AssetRipper[_-]linux[_-]x64([_.-].*)?\.(tar\.xz|tar\.gz|tgz|zip)$' \
            output/assetripper-assets.txt | head -1 || true)"
          if [ -z "$ASSET" ]; then
            echo 'ERROR: AssetRipper 2.0.0 Linux x64 release archive not found.' >&2
            cat output/assetripper-assets.txt
            exit 1
          fi
          printf '%s\n' "$ASSET" | tee output/selected-assetripper-archive.txt
          gh release download 2.0.0 -R AssetRipper/AssetRipper \
            -p "$ASSET" -D tools --clobber
          test -s "tools/$ASSET"
          case "$ASSET" in
            *.tar.xz) tar -xJf "tools/$ASSET" -C tools/assetripper ;;
            *.tar.gz|*.tgz) tar -xzf "tools/$ASSET" -C tools/assetripper ;;
            *.zip) unzip -oq "tools/$ASSET" -d tools/assetripper ;;
            *) echo "Unsupported AssetRipper archive: $ASSET" >&2; exit 1 ;;
          esac

          RIPPER="$(find tools/assetripper -type f \
            \( -name AssetRipper.GUI.Free -o -name AssetRipper.GUI -o -name AssetRipper \) \
            -print -quit)"
          test -n "$RIPPER" && test -f "$RIPPER" || {
            echo 'ERROR: AssetRipper executable was not found:' >&2
            find tools/assetripper -maxdepth 3 -type f | head -70
            exit 1
          }

          chmod +x "$RIPPER"
          file "$RIPPER" | tee output/assetripper-file-type.txt
          # Detect incompatible format BEFORE attempting to launch it.
          python3 - "$RIPPER" <<'PY'
          import struct, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()[:20]
          if len(data) < 20 or data[:4] != b'\x7fELF':
              raise SystemExit('ERROR: downloaded AssetRipper is not a Linux ELF binary')
          elf_class = data[4]
          endian = '<' if data[5] == 1 else '>'
          machine = struct.unpack(endian+'H', data[18:20])[0]
          print('ELF class:', elf_class, 'machine:', machine)
          if elf_class != 2 or machine != 62:
              raise SystemExit('ERROR: AssetRipper is not Linux x86_64 (EM_X86_64=62).')
          PY
          echo "$RIPPER" > output/assetripper-path.txt
          echo "Selected Linux x64 binary: $RIPPER"

      - name: Load the COMPLETE Android game in AssetRipper
        shell: bash
        run: |
          set -euo pipefail
          RIPPER="$(cat output/assetripper-path.txt)"
          INPUT="$PWD/work/apk"  # Contains assets + lib/arm64-v8a/libil2cpp.so + metadata
          EXPORT="$PWD/recovered/PostalX"
          mkdir -p "$EXPORT"
          "$RIPPER" --headless --port 3333 > output/assetripper.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3333/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'AssetRipper exited unexpectedly.' >&2
              tail -100 output/assetripper.log || true
              exit 1
            fi
            sleep 1
          done
          test "$READY" = 1 || { echo 'AssetRipper web server did not start.'; exit 1; }
          echo "Loading the FULL extracted APK: $INPUT"
          echo 'Checking that original native code and metadata are available:'
          ls -lh "$INPUT/lib/arm64-v8a/libil2cpp.so" \
                 "$INPUT/assets/bin/Data/Managed/Metadata/global-metadata.dat"

          # v4 used only the Data/ folder, hiding libil2cpp.so from AssetRipper.
          # v5 loads the entire extracted APK including its native IL2CPP binary.
          curl -fsS -L --retry 2 --max-time 3600 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "Path=$INPUT" \
            http://127.0.0.1:3333/LoadFolder \
            -o output/load-full-apk-response.html

          curl -fsS -L --max-time 3600 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "Path=$EXPORT" \
            --data-urlencode 'CreateSubfolder=false' \
            http://127.0.0.1:3333/Export/UnityProject \
            -o output/export-response.html

          PROJECT="$(find "$EXPORT" -type d -name Assets -print -quit \
            | xargs -r dirname)"
          test -n "$PROJECT" && test -d "$PROJECT/Assets" || {
            echo 'AssetRipper did not produce a Unity project.' >&2
            tail -150 output/assetripper.log
            exit 1
          }
          echo "$PROJECT" > output/project-path.txt
          echo "Project: $PROJECT"

      - name: Audit REAL game scripts (fix v4 false 0-stubs result)
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(cat output/project-path.txt)"
          python3 - "$PROJECT" <<'PY'
          import sys
          from pathlib import Path
          project = Path(sys.argv[1]); assets = project/'Assets'
          scenes = list(assets.rglob('*.unity'))
          scripts = list(assets.rglob('*.cs'))
          # Unlike v4, this detects AssetRipper's actual marker "Dummy class."
          gameplay = [p for p in scripts
                      if '/Assembly-CSharp/' in '/' + p.as_posix()]
          dummy = []
          not_dummy = []
          for p in gameplay:
              data = p.read_text(encoding='utf-8', errors='replace')
              if any(token in data for token in (
                    'Dummy class.', 'NotImplementedException',
                    'Generated using dummy', 'generated dummy class')):
                  dummy.append(p)
              else:
                  not_dummy.append(p)
          report = ('Unity 6000.2.7f2\n'
                    f'Scenes: {len(scenes)}\n'
                    f'All C# files (including Unity packages): {len(scripts)}\n'
                    f'Assembly-CSharp gameplay classes: {len(gameplay)}\n'
                    f'Gameplay dummy scripts: {len(dummy)}\n'
                    f'Gameplay without dummy marker: {len(not_dummy)}\n'
                    '\nNOTE: No dummy marker does NOT prove the game works.\n')
          Path('output/real-game-code-audit.txt').write_text(report)
          Path('output/dummy-files.txt').write_text('\n'.join(str(p) for p in dummy)+'\n')
          Path('output/non-dummy-files.txt').write_text(
              '\n'.join(str(p) for p in not_dummy)+'\n')
          print(report)
          with open(Path.cwd()/ 'output' / 'code-example.txt','w') as f:
              for p in not_dummy[:5]:
                  f.write(f'===== {p} =====\n')
                  f.write(p.read_text(encoding='utf-8',errors='replace')[:2500]+'\n')
          with open(Path.cwd()/ 'output' / 'code-example.txt','a') as f:
              if not not_dummy:
                  f.write('No non-dummy Assembly-CSharp files were recovered.\n')
          with open(Path.cwd()/ 'output' / 'overview.txt','w') as f:
              f.write(report)
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('### Postal X FULL APK audit\n\n```text\n'+report+'```\n')
          PY

      - name: Check native IL2CPP with Cpp2IL (independent experiment)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -uo pipefail
          mkdir -p tools/cpp2il output/cpp2il-out
          # Official Cpp2IL native Linux release: no SDK or Unity account required.
          # Prefer recent published release with an x64 Linux archive.
          gh api 'repos/SamboyCoding/Cpp2IL/releases?per_page=30' \
            > output/cpp2il-releases.json || exit 0
          python3 - <<'PY'
          import json
          from pathlib import Path
          releases = json.loads(Path('output/cpp2il-releases.json').read_text())
          for release in releases:
              for a in release.get('assets', []):
                  name = a.get('name','').lower()
                  if ('linux' in name and 'arm' not in name
                          and (name.endswith('.zip') or name.endswith('.tar.gz'))):
                      Path('output/cpp2il-release-tag.txt').write_text(release['tag_name'])
                      Path('output/cpp2il-asset.txt').write_text(a['name'])
                      print('Cpp2IL:', release['tag_name'], a['name'])
                      raise SystemExit(0)
          raise SystemExit('No official Linux x64 release archive found')
          PY
          TAG="$(cat output/cpp2il-release-tag.txt)"
          ASSET="$(cat output/cpp2il-asset.txt)"
          gh release download "$TAG" -R SamboyCoding/Cpp2IL \
            --pattern "$ASSET" -D tools --clobber || exit 0
          case "$ASSET" in
            *.zip) unzip -q "tools/$ASSET" -d tools/cpp2il ;;
            *.tar.gz) tar -xzf "tools/$ASSET" -C tools/cpp2il ;;
          esac
          BIN="$(find tools/cpp2il -type f \( -name Cpp2IL -o -name CPP2IL \) \
            -print -quit)"
          test -n "$BIN" || { echo 'Cpp2IL executable missing' | tee output/cpp2il.log; exit 0; }
          chmod +x "$BIN"
          "$BIN" --list-output-formats > output/cpp2il-formats.txt 2>&1 || true
          if grep -q 'dll_il_recovery' output/cpp2il-formats.txt; then
            FORMAT=dll_il_recovery
          elif grep -q 'dummydll' output/cpp2il-formats.txt; then
            FORMAT=dummydll
          else
            echo 'No supported Cpp2IL output format' | tee output/cpp2il.log
            exit 0
          fi
          echo "Using Cpp2IL format: $FORMAT" | tee output/cpp2il.log
          "$BIN" --game-path "$PWD/input/PostalX_ANDROID.apk" \
            --output-as "$FORMAT" --output-to "$PWD/output/cpp2il-out" \
            >> output/cpp2il.log 2>&1 || true
          find output/cpp2il-out -type f -printf '%p %s bytes\n' | head -60 \
            > output/cpp2il-files.txt || true
          # A dummydll result is metadata, NOT playable C# game code.
          echo "CPP2IL FORMAT=$FORMAT" >> output/overview.txt

      - name: Attach original icon to reconstructed project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(cat output/project-path.txt)"
          cp output/PostalX-original-icon.png "$PROJECT/Assets/PostalX-original-icon.png"
          mkdir -p "$PROJECT/ProjectSettings"
          printf 'm_EditorVersion: 6000.2.7f2\n' \
            > "$PROJECT/ProjectSettings/ProjectVersion.txt"

      - name: Archive recovery (diagnostic, NOT playable IPA)
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(cat output/project-path.txt)"
          tar -czf Postal-X-v5-Recovered-Unity.tar.gz -C "$PROJECT" .
          ls -lh Postal-X-v5-Recovered-Unity.tar.gz

      - name: Upload full APK recovery diagnostics and ORIGINAL icon
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Postal-X-v5-Full-APK-Diagnostics
          path: output/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload recovered Unity project
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Postal-X-v5-Recovered-Unity
          path: Postal-X-v5-Recovered-Unity.tar.gz
          retention-days: 3
          if-no-files-found: error
          compression-level: 0
