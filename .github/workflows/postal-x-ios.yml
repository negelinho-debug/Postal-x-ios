name: Postal X iOS v3 - fix AssetRipper Linux x64

on:
  workflow_dispatch:
    inputs:
      force_experimental_build:
        description: "Attempt iOS export even if recovered gameplay scripts are incomplete (may NOT be playable)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read

jobs:
  recover:
    name: 1. Recover original Postal X Unity assets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      game_code_ready: ${{ steps.audit.outputs.game_code_ready }}
      scenes_found: ${{ steps.audit.outputs.scenes_found }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get the original PostalX_ANDROID.apk from Releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input output work/apk
          if [ ! -f input/PostalX_ANDROID.apk ]; then
            while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              gh release download "$tag" \
                --pattern 'PostalX_ANDROID.apk' \
                --dir input --clobber && break || true
            done < <(gh release list --limit 30 --json tagName --jq '.[].tagName')
          fi
          test -s input/PostalX_ANDROID.apk || {
            echo 'ERROR: Add PostalX_ANDROID.apk to a Release of THIS repository.' >&2
            exit 1
          }
          sha256sum input/PostalX_ANDROID.apk | tee output/apk-sha256.txt
          unzip -q input/PostalX_ANDROID.apk -d work/apk

      - name: Verify Unity 6 IL2CPP and extract the ORIGINAL icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          base = Path('work/apk')
          gg = base/'assets/bin/Data/globalgamemanagers'
          meta = base/'assets/bin/Data/Managed/Metadata/global-metadata.dat'
          il2cpp = base/'lib/arm64-v8a/libil2cpp.so'
          icon = base/'res/oj.png' # Verified launcher bitmap from THIS APK
          for p in (gg, meta, il2cpp, icon):
              if not p.is_file():
                  raise SystemExit('Wrong/missing Postal X APK file: '+str(p))
          version = '6000.2.7f2'
          if version.encode() not in gg.read_bytes():
              raise SystemExit('Expected Unity '+version+' in globalgamemanagers')
          Path('output/PostalX-original-icon.png').write_bytes(icon.read_bytes())
          Path('output/unity-version.txt').write_text(version+'\n')
          Path('output/il2cpp-info.txt').write_text(
              'Android IL2CPP confirmed. Android libil2cpp.so is not an iOS binary.\n'
              'Game scripts may not be recoverable from APK metadata.\n'
              'A reconstructed project is NOT equivalent to original Unity source.\n'
          )
          print('Unity version:',version,'icon sha256:',sha256(icon.read_bytes()).hexdigest())
          PY

      - name: Join Android Unity split assets for AssetRipper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          d=Path('work/apk/assets/bin/Data')
          groups={}
          for f in d.rglob('*.split*'):
              m=re.fullmatch(r'(.+)\.split(\d+)', f.name)
              if m:
                  groups.setdefault(f.with_name(m.group(1)), {})[int(m.group(2))]=f
          lines=[]
          for target,parts in sorted(groups.items()):
              order=sorted(parts)
              if order != list(range(len(order))):
                  raise SystemExit(f'Nonconsecutive split parts: {target}: {order}')
              if target.exists():
                  raise SystemExit(f'Refusing to overwrite Unity file: {target}')
              with target.open('wb') as out:
                  for i in order:
                      with parts[i].open('rb') as inp:
                          while True:
                              block=inp.read(1024*1024)
                              if not block: break
                              out.write(block)
              lines.append(f'{target.name}: {target.stat().st_size} bytes / {len(order)} parts')
          Path('output/rejoined-split-assets.txt').write_text('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY

      - name: Download correct AssetRipper 2.0.0 for Linux x86_64
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tools/assetripper

          echo "Runner CPU: $(uname -m)"
          test "$(uname -m)" = "x86_64" || {
            echo 'This workflow requires the GitHub Ubuntu x86_64 runner.' >&2
            exit 1
          }

          gh api repos/AssetRipper/AssetRipper/releases/tags/2.0.0 \
            --jq '.assets[].name' | tee output/assetripper-assets.txt

          # v2 accidentally matched ARM64 because its regex ended in "64".
          # Pick ONLY the x64 archive, NEVER linux_arm64 or Windows/macOS.
          ASSET="$(grep -Ei '^AssetRipper[_-]linux[_-]x64([_.-].*)?\.(tar\.xz|tar\.gz|tgz|zip)$' \
            output/assetripper-assets.txt | head -1 || true)"
          if [ -z "$ASSET" ]; then
            echo 'ERROR: AssetRipper 2.0.0 Linux x64 release archive not found.' >&2
            cat output/assetripper-assets.txt
            exit 1
          fi
          printf '%s\n' "$ASSET" | tee output/selected-assetripper-archive.txt
          gh release download 2.0.0 -R AssetRipper/AssetRipper \
            -p "$ASSET" -D tools --clobber
          test -s "tools/$ASSET"
          case "$ASSET" in
            *.tar.xz) tar -xJf "tools/$ASSET" -C tools/assetripper ;;
            *.tar.gz|*.tgz) tar -xzf "tools/$ASSET" -C tools/assetripper ;;
            *.zip) unzip -oq "tools/$ASSET" -d tools/assetripper ;;
            *) echo "Unsupported AssetRipper archive: $ASSET" >&2; exit 1 ;;
          esac

          RIPPER="$(find tools/assetripper -type f \
            \( -name AssetRipper.GUI.Free -o -name AssetRipper.GUI -o -name AssetRipper \) \
            -print -quit)"
          test -n "$RIPPER" && test -f "$RIPPER" || {
            echo 'ERROR: AssetRipper executable was not found:' >&2
            find tools/assetripper -maxdepth 3 -type f | head -70
            exit 1
          }

          chmod +x "$RIPPER"
          file "$RIPPER" | tee output/assetripper-file-type.txt
          # Detect incompatible format BEFORE attempting to launch it.
          python3 - "$RIPPER" <<'PY'
          import struct, sys
          from pathlib import Path
          data = Path(sys.argv[1]).read_bytes()[:20]
          if len(data) < 20 or data[:4] != b'\x7fELF':
              raise SystemExit('ERROR: downloaded AssetRipper is not a Linux ELF binary')
          elf_class = data[4]
          endian = '<' if data[5] == 1 else '>'
          machine = struct.unpack(endian+'H', data[18:20])[0]
          print('ELF class:', elf_class, 'machine:', machine)
          if elf_class != 2 or machine != 62:
              raise SystemExit('ERROR: AssetRipper is not Linux x86_64 (EM_X86_64=62).')
          PY
          echo "$RIPPER" > output/assetripper-path.txt
          echo "Selected Linux x64 binary: $RIPPER"

      - name: Recover Unity project with AssetRipper
        shell: bash
        run: |
          set -euo pipefail
          RIPPER="$(cat output/assetripper-path.txt)"
          INPUT="$PWD/work/apk/assets/bin/Data"
          EXPORT="$PWD/recovered/PostalX"
          mkdir -p "$EXPORT"
          "$RIPPER" --headless --port 3333 > output/assetripper.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          READY=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3333/ >/dev/null 2>&1; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo 'AssetRipper process exited before its web server became ready.' >&2
              tail -150 output/assetripper.log
              exit 1
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo 'AssetRipper did not start within 90 seconds.' >&2
            tail -150 output/assetripper.log
            exit 1
          fi
          curl -fsS -L --max-time 3600 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "Path=$INPUT" \
            http://127.0.0.1:3333/LoadFolder \
            -o output/load-response.html
          curl -fsS -L --max-time 3600 \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "Path=$EXPORT" \
            --data-urlencode 'CreateSubfolder=false' \
            http://127.0.0.1:3333/Export/UnityProject \
            -o output/export-response.html
          PROJECT="$(find "$EXPORT" -type d -name Assets -print -quit \
            | xargs -r dirname)"
          if [ -z "$PROJECT" ] || [ ! -d "$PROJECT/Assets" ]; then
            echo 'AssetRipper did not create a Unity project; review diagnostic logs.' >&2
            exit 1
          fi
          echo "$PROJECT" > output/project-path.txt
          echo "Reconstructed project: $PROJECT"

      - name: Audit recovered project for scenes and game code
        id: audit
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(cat output/project-path.txt)"
          SCENES="$(find "$PROJECT/Assets" -type f -name '*.unity' | wc -l | tr -d ' ')"
          SCRIPTS="$(find "$PROJECT/Assets" -type f -name '*.cs' ! -path '*/Editor/*' | wc -l | tr -d ' ')"
          STUBS="$( (grep -rlE 'NotImplementedException|DummyDll|throw new System.NotImplementedException' \
            "$PROJECT/Assets" --include='*.cs' 2>/dev/null || true) | wc -l | tr -d ' ')"
          printf 'Unity: 6000.2.7f2\nScenes: %s\nExported C# files: %s\nLikely stubs: %s\n' \
            "$SCENES" "$SCRIPTS" "$STUBS" | tee output/recovery-audit.txt
          echo "scenes_found=$([ "$SCENES" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          # With Android IL2CPP there is no reliable way to prove recovered
          # C# contains original gameplay. Default to NOT treating it as ready.
          echo 'game_code_ready=false' >> "$GITHUB_OUTPUT"
          echo '### Postal X recovery' >> "$GITHUB_STEP_SUMMARY"
          cat output/recovery-audit.txt >> "$GITHUB_STEP_SUMMARY"
          echo '⚠️ Recovered Unity assets are NOT proof the original IL2CPP game code was restored.' >> "$GITHUB_STEP_SUMMARY"

      - name: Add the ORIGINAL icon and iOS build script
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(cat output/project-path.txt)"
          mkdir -p "$PROJECT/Assets/Editor" "$PROJECT/ProjectSettings"
          cp output/PostalX-original-icon.png "$PROJECT/Assets/PostalX-original-icon.png"
          printf 'm_EditorVersion: 6000.2.7f2\n' > "$PROJECT/ProjectSettings/ProjectVersion.txt"
          # Exclude Android native libraries. iOS cannot load .so/.aar/.jar.
          find "$PROJECT/Assets" -type f \
            \( -iname '*.so' -o -iname '*.aar' -o -iname '*.jar' \) -delete
          rm -rf "$PROJECT/Assets/Plugins/Android" "$PROJECT/Library"
          cat > "$PROJECT/Assets/Editor/PostalXIOSBuild.cs" <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using UnityEditor;
          using UnityEditor.Build;
          using UnityEditor.Build.Reporting;
          using UnityEngine;

          public static class PostalXIOSBuild
          {
              public static void Build()
              {
                  string[] scenes = AssetDatabase.FindAssets("t:Scene", new [] {"Assets"})
                      .Select(AssetDatabase.GUIDToAssetPath)
                      .Where(s => !string.IsNullOrEmpty(s) && s.EndsWith(".unity"))
                      .Distinct().OrderBy(s => s).ToArray();
                  if (scenes.Length == 0)
                      throw new Exception("No Unity scenes recovered from APK");
                  EditorBuildSettings.scenes = scenes
                      .Select(s => new EditorBuildSettingsScene(s, true)).ToArray();
                  PlayerSettings.SetScriptingBackend(NamedBuildTarget.iOS,
                      ScriptingImplementation.IL2CPP);
                  PlayerSettings.SetApplicationIdentifier(NamedBuildTarget.iOS,
                      "com.zhenia.postalx.ios");
                  PlayerSettings.iOS.targetOSVersionString = "15.0";
                  string output = Path.GetFullPath(
                      Path.Combine(Application.dataPath, "../../build/PostalX-iOS"));
                  var options = new BuildPlayerOptions {
                      scenes = scenes, locationPathName = output,
                      target = BuildTarget.iOS,
                      options = BuildOptions.None
                  };
                  var result = BuildPipeline.BuildPlayer(options);
                  if (result.summary.result != BuildResult.Succeeded)
                      throw new Exception("Unity export failed: " + result.summary.result);
              }
          }
          CS

      - name: Archive recovered project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$(cat output/project-path.txt)"
          tar -czf postalx-recovered.tar.gz -C "$PROJECT" .
          ls -lh postalx-recovered.tar.gz

      - name: Upload original icon and project diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Postal-X-v3-Recovery-Diagnostics-and-Original-Icon
          path: output/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload reconstructed project (not guaranteed playable)
        uses: actions/upload-artifact@v4
        with:
          name: Postal-X-v3-Recovered-Unity-EXPERIMENTAL
          path: postalx-recovered.tar.gz
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  experimental_ios:
    name: 2. EXPERIMENTAL Unity iOS export - not verified playable
    needs: recover
    if: >-
      ${{ needs.recover.outputs.scenes_found == 'true' &&
          (needs.recover.outputs.game_code_ready == 'true' ||
           inputs.force_experimental_build == true) }}
    runs-on: macos-latest
    timeout-minutes: 180
    env:
      UNITY_EMAIL: ${{ secrets.UNITY_USERNAME }}
      UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Retrieve recovered Unity project
        uses: actions/download-artifact@v4
        with:
          name: Postal-X-v3-Recovered-Unity-EXPERIMENTAL
          path: recovered
      - name: Extract project and prepare diagnostics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reconstructed-project output
          tar -xzf recovered/postalx-recovered.tar.gz -C reconstructed-project
          test -d reconstructed-project/Assets
          echo 'WARNING: Experimental build from reconstructed assets.' | tee output/READ_ME_FIRST.txt
          echo 'The APK used IL2CPP. This build may contain no original gameplay code.' \
            | tee -a output/READ_ME_FIRST.txt
      - name: Install Unity Hub and CLI
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Activate Unity Personal and install Unity 6 iOS support
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UNITY_EMAIL" && test -n "$UNITY_PASSWORD" || {
            echo 'Set UNITY_USERNAME and UNITY_PASSWORD as GitHub repository secrets.' >&2
            exit 1
          }
          npm install -g @rage-against-the-pixel/unity-cli
          unity-cli hub-install --json
          unity-cli activate-license --license personal \
            --email "$UNITY_EMAIL" --password "$UNITY_PASSWORD" --json
          export UNITY_CLI_HOME="$PWD/tools/unity-cli"
          export UNITY_CLI_CHANNEL=beta
          export UNITY_NON_INTERACTIVE=1
          export UNITY_NO_CONSENT_PROMPT=1
          export UNITY_NO_UPDATE_CHECK=1
          mkdir -p "$UNITY_CLI_HOME"
          curl -fsSL --retry 4 \
            https://public-cdn.cloud.unity3d.com/hub/prod/cli/install.sh \
            -o /tmp/unity-install.sh
          bash /tmp/unity-install.sh
          UNITY="$UNITY_CLI_HOME/bin/unity"
          test -x "$UNITY"
          "$UNITY" --non-interactive --no-banner --no-color \
            editors install-path --set "$HOME/UnityEditors"
          "$UNITY" --non-interactive --no-banner --no-color \
            install 6000.2.7f2 --changeset 2b518236b676 \
            --module ios --no-child-modules --yes --accept-eula \
            2>&1 | tee output/unity-install.log
          UNITY_BIN="$(find "$HOME/UnityEditors" -type f \
            -path '*/Unity.app/Contents/MacOS/Unity' -print -quit)"
          test -x "$UNITY_BIN"
          echo "$UNITY_BIN" > output/unity-bin.txt
      - name: Export experimental Unity iOS Xcode project
        shell: bash
        run: |
          set -o pipefail
          "$(cat output/unity-bin.txt)" \
            -batchmode -nographics -quit \
            -projectPath "$PWD/reconstructed-project" \
            -buildTarget iOS \
            -executeMethod PostalXIOSBuild.Build \
            -logFile - 2>&1 | tee output/unity-export.log
      - name: Apply ORIGINAL Postal X icon to Unity Xcode asset catalog
        shell: bash
        run: |
          set -euo pipefail
          ICON="$PWD/reconstructed-project/Assets/PostalX-original-icon.png"
          test -s "$ICON"
          CATALOG="$(find build/PostalX-iOS -type d -name AppIcon.appiconset -print -quit)"
          if [ -n "$CATALOG" ]; then
            python3 - "$CATALOG" <<'PYICON'
          from pathlib import Path
          import json,sys
          catalog=Path(sys.argv[1])
          images=[
             {'idiom':'iphone','size':'60x60','scale':'2x','filename':'Icon120.png'},
             {'idiom':'iphone','size':'60x60','scale':'3x','filename':'Icon180.png'},
             {'idiom':'ipad','size':'76x76','scale':'2x','filename':'Icon152.png'},
             {'idiom':'ipad','size':'83.5x83.5','scale':'2x','filename':'Icon167.png'},
             {'idiom':'universal','platform':'ios','size':'1024x1024','filename':'Icon1024.png'},
          ]
          (catalog/'Contents.json').write_text(
              json.dumps({'images':images,'info':{'author':'xcode','version':1}},indent=2))
          PYICON
            for n in 120 180 152 167 1024; do
              sips -z "$n" "$n" "$ICON" \
                --out "$CATALOG/Icon${n}.png" >/dev/null
            done
            echo "Applied original Android launcher artwork to $CATALOG"
          else
            echo 'No AppIcon.appiconset found in exported Xcode project.'
            echo 'The original PNG will still be included in the app bundle.'
          fi
      - name: Compile iPhone arm64 app with Xcode
        shell: bash
        run: |
          set -o pipefail
          PROJECT="$PWD/build/PostalX-iOS/Unity-iPhone.xcodeproj"
          test -d "$PROJECT"
          xcodebuild -project "$PROJECT" \
            -scheme Unity-iPhone -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/DerivedData" \
            ARCHS=arm64 CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM='' \
            build 2>&1 | tee output/xcodebuild.log
      - name: Package IPA with Postal X original icon
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find DerivedData/Build/Products/Release-iphoneos \
            -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/PostalX.app
          ICON=reconstructed-project/Assets/PostalX-original-icon.png
          test -s "$ICON"
          # Include original artwork; actual installed icon also depends on
          # the recovered project's compiled Unity asset catalog.
          cp "$ICON" Payload/PostalX.app/PostalX-original-icon.png
          sips -z 120 120 "$ICON" --out Payload/PostalX.app/Icon-60@2x.png >/dev/null
          sips -z 180 180 "$ICON" --out Payload/PostalX.app/Icon-60@3x.png >/dev/null
          /usr/libexec/PlistBuddy -c 'Set :CFBundleDisplayName Postal X' \
            Payload/PostalX.app/Info.plist || true
          rm -rf Payload/PostalX.app/_CodeSignature
          rm -f Payload/PostalX.app/embedded.mobileprovision
          zip -qry Postal-X-iOS-v2-EXPERIMENTAL-UNSIGNED.ipa Payload
          ls -lh Postal-X-iOS-v2-EXPERIMENTAL-UNSIGNED.ipa
      - name: Upload experimental IPA (NOT verified playable)
        uses: actions/upload-artifact@v4
        with:
          name: Postal-X-iOS-v2-EXPERIMENTAL-UNSIGNED
          path: Postal-X-iOS-v2-EXPERIMENTAL-UNSIGNED.ipa
          retention-days: 7
          if-no-files-found: error
      - name: Return Unity Personal license
        if: always()
        run: unity-cli return-license --license personal || true
      - name: Upload iOS build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Postal-X-v3-iOS-Build-Logs
          path: output/
          if-no-files-found: ignore
          retention-days: 7
